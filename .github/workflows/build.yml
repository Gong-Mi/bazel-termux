name: build-termux-bazel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAZEL_VERSION: 6.3.0
      ANDROID_API: "28"
      ANDROID_ABI: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      - name: Install bootstrap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openjdk-17-jdk zip unzip patch python3

      - name: Install Android NDK r29
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/android-ndk.zip -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r29" >> "$GITHUB_ENV"
          test -x "$RUNNER_TEMP/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$RUNNER_TEMP/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          printf 'int main(void) { return 0; }\n' > /tmp/ndk-driver-smoke.c
          "$RUNNER_TEMP/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --target=aarch64-linux-android${ANDROID_API} /tmp/ndk-driver-smoke.c -o /tmp/ndk-driver-smoke
          readelf -h /tmp/ndk-driver-smoke | grep -q AArch64

      - name: Download official Bazel distribution archive
        run: |
          curl --fail --location --retry 3 \
            --output bazel-${BAZEL_VERSION}-dist.zip \
            https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-dist.zip
          unzip -q bazel-${BAZEL_VERSION}-dist.zip -d src
          test -f src/compile.sh
          test -d src/derived/src/java

      - name: Register NDK headers in Bazel's local C++ toolchain
        working-directory: src
        env:
          NDK_SYSROOT: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          NDK_CLANG_RESOURCE: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/21/include
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("tools/cpp/unix_cc_configure.bzl")
          text = path.read_text()
          marker = "    builtin_include_directories = _uniq(\n"
          additions = (
              "        [\n"
              f"            {os.environ['NDK_SYSROOT']!r} + '/usr/include',\n"
              f"            {os.environ['NDK_SYSROOT']!r} + '/usr/include/aarch64-linux-android',\n"
              f"            {os.environ['NDK_CLANG_RESOURCE']!r},\n"
              "        ] +\n"
          )
          assert text.count(marker) == 1
          path.write_text(text.replace(marker, marker + additions))
          PY
          sed -n '444,462p' tools/cpp/unix_cc_configure.bzl

      - name: Patch Bazel's pinned Abseil for Clang 21 constexpr rules
        working-directory: src
        run: |
          python3 -c 'from pathlib import Path; p=Path("WORKSPACE"); t=p.read_text(); q=chr(34); n=chr(10); old="dist_http_archive("+n+"    name = "+q+"com_google_absl"+q+","+n+")"; new="dist_http_archive("+n+"    name = "+q+"com_google_absl"+q+","+n+"    patches = ["+q+"//:abseil-clang21-constexpr.patch"+q+", "+q+"//:abseil-randen-copts.patch"+q+"],"+n+"    patch_args = ["+q+"-p1"+q+"],"+n+")"; assert t.count(old)==1; p.write_text(t.replace(old,new))'
          cp "${{ github.workspace }}/patches/abseil-clang21-constexpr.patch" .
          cp "${{ github.workspace }}/patches/abseil-randen-copts.patch" .
          sed -n '664,676p' WORKSPACE

      - name: Patch Bazel's pinned protobuf for bionic pthread
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("WORKSPACE")
          text = path.read_text()
          old = '''dist_http_archive(
              name = "com_google_protobuf",
              patch_cmds = EXPORT_WORKSPACE_IN_BUILD_FILE,
              patch_cmds_win = EXPORT_WORKSPACE_IN_BUILD_FILE_WIN,
          )'''
          new = '''dist_http_archive(
              name = "com_google_protobuf",
              patch_cmds = EXPORT_WORKSPACE_IN_BUILD_FILE,
              patch_cmds_win = EXPORT_WORKSPACE_IN_BUILD_FILE_WIN,
              patches = [
                  "//third_party/protobuf:3.19.6.patch",
                  "//:protobuf-pthread.patch",
              ],
              patch_args = ["-p1"],
          )'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          cp "${{ github.workspace }}/patches/protobuf-pthread.patch" .
          grep -n -A8 'com_google_protobuf' WORKSPACE | head -12

      - name: Patch Bazel tools to drop bionic-absent -lrt
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rel in ["src/main/tools/BUILD", "src/main/cpp/BUILD"]:
              path = Path(rel)
              lines = path.read_text().splitlines()
              kept = [l for l in lines if '"-lrt",' not in l]
              assert len(lines) - len(kept) == 2, (rel, len(lines), len(kept))
              path.write_text("\n".join(kept) + "\n")
          PY
          grep -rn '"-lrt"' src/main/tools/BUILD src/main/cpp/BUILD || echo "no -lrt remaining"

      - name: Patch Bazel JNI source for Android bionic strerror_r
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/native/unix_jni_linux.cc")
          text = path.read_text()
          old = "#if !__GLIBC__ || (_POSIX_C_SOURCE >= 200112L && !_GNU_SOURCE)"
          new = "#if (!__GLIBC__ && !defined(__BIONIC__)) || (_POSIX_C_SOURCE >= 200112L && !_GNU_SOURCE)"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          grep -n -A9 -B3 '__BIONIC__' src/main/native/unix_jni_linux.cc

      - name: Patch Bazel 6.3 bootstrap for JDK 17 module access
        working-directory: src
        run: |
          sed -i '/-Djava.util.logging.config.file=/a\      --add-opens java.base/java.lang=ALL-UNNAMED \\' scripts/bootstrap/compile.sh
          grep -n -A3 -B2 'java.base/java.lang' scripts/bootstrap/compile.sh

      - name: Patch Bazel process-tools for Android bionic wait3
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/main/tools/process-tools.cc")
          text = path.read_text()
          old = "      err = wait3(&status, 0, rusage);"
          new = "      err = wait4(-1, &status, 0, rusage);"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          grep -n 'wait4(-1, &status' src/main/tools/process-tools.cc

      - name: Build and inject native aarch64 build-runfiles helper
        run: |
          set -eux
          mkdir -p src/main/tools
          cp helper-tools/logging.h src/main/tools/
          CLANG="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CLANG" --target=aarch64-linux-android${{ env.ANDROID_API }} \
            --sysroot="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            -std=c++17 -I. -Ihelper-tools \
            helper-tools/build-runfiles.cc helper-tools/logging.cc \
            -o src/main/tools/build-runfiles
          file src/main/tools/build-runfiles

      - name: Select host-vs-target compiler boundary
        run: |
          chmod 755 ci/dual-clang ci/dual-clang++
          sed -n '1,80p' ci/dual-clang
          sed -n '1,80p' ci/dual-clang++

      - name: Bootstrap Android aarch64 Bazel
        working-directory: src
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          BAZEL_WRKDIR: ${{ github.workspace }}/work
          # Bazel invokes the same compiler entry point for host tools and
          # Android targets. The dispatchers keep [for tool] host actions
          # Linux-runnable, while target actions carrying --target/--sysroot
          # use the NDK compiler.
          CC: ${{ github.workspace }}/ci/dual-clang
          CXX: ${{ github.workspace }}/ci/dual-clang++
          AR: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          STRIP: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          BAZEL_CXXOPTS: -std=c++17
          EXTRA_BAZEL_ARGS: >-
            --host_javabase=@local_jdk//:jdk
            --host_copt=-Wno-error=deprecated-builtins
            --host_copt=-Wno-gnu-offsetof-extensions
            --host_copt=-Wno-error=gnu-offsetof-extensions
            --host_copt=-Wno-error=pedantic
            --host_per_file_copt=.*@-Wno-c23-extensions
            --host_per_file_copt=.*@-Wno-error=gnu-offsetof-extensions
            --host_per_file_copt=.*@-Wno-error=pedantic
            --host_features=-module_maps
            --features=-module_maps
            --action_env=ANDROID_NDK_HOME
            --copt=--target=aarch64-linux-android${{ env.ANDROID_API }}
            --copt=--sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --copt=-fPIC
            --copt=-Wno-error=deprecated-builtins
            --per_file_copt=.*@-Wno-c23-extensions
            --copt=-Dgetservbyport_r(a,b,c,d,e,f)=getservbyport(a,b)
            --linkopt=--target=aarch64-linux-android${{ env.ANDROID_API }}
            --linkopt=--sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --linkopt=-pie
            --linkopt=-Wl,-rpath,'$ORIGIN/../lib':$ORIGIN
            --features=-parse_headers
        run: |
          set -o pipefail
          ./compile.sh 2>&1 | tee ../bootstrap.log

      - name: Verify Android ELF and minimize artifact
        run: |
          set -eux
          BIN=src/output/bazel
          test -x "$BIN"
          file "$BIN"
          readelf -h "$BIN" | tee elf-header.txt
          readelf -l "$BIN" | tee elf-program-headers.txt
          readelf -d "$BIN" | tee elf-dynamic.txt
          readelf -h "$BIN" | grep -q 'AArch64'
          readelf -l "$BIN" | grep -q '/system/bin/linker64'
          # Bazel's output is a self-extracting ELF + ZIP. llvm-strip truncates
          # the appended ZIP payload, so preserve the launcher byte-for-byte.
          mkdir artifact
          cp "$BIN" artifact/bazel
          cp elf-header.txt elf-program-headers.txt elf-dynamic.txt artifact/
          sha256sum artifact/bazel | tee artifact/bazel.sha256

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-${{ env.BAZEL_VERSION }}-termux-aarch64
          path: |
            artifact/
            bootstrap.log
          if-no-files-found: warn
