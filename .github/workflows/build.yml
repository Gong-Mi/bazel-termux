name: build-termux-bazel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BAZEL_VERSION: 6.3.0
      ANDROID_API: "28"
      ANDROID_ABI: aarch64-linux-android
    steps:
      - name: Install bootstrap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential openjdk-17-jdk zip unzip patch python3

      - name: Install Android NDK r29
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/android-ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q /tmp/android-ndk.zip -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r29" >> "$GITHUB_ENV"
          test -x "$RUNNER_TEMP/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          "$RUNNER_TEMP/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          printf 'int main(void) { return 0; }\n' > /tmp/ndk-driver-smoke.c
          "$RUNNER_TEMP/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --target=aarch64-linux-android${ANDROID_API} /tmp/ndk-driver-smoke.c -o /tmp/ndk-driver-smoke
          readelf -h /tmp/ndk-driver-smoke | grep -q AArch64

      - name: Download official Bazel distribution archive
        run: |
          curl --fail --location --retry 3 \
            --output bazel-${BAZEL_VERSION}-dist.zip \
            https://github.com/bazelbuild/bazel/releases/download/${BAZEL_VERSION}/bazel-${BAZEL_VERSION}-dist.zip
          unzip -q bazel-${BAZEL_VERSION}-dist.zip -d src
          test -f src/compile.sh
          test -d src/derived/src/java

      - name: Register NDK headers in Bazel's local C++ toolchain
        working-directory: src
        env:
          NDK_SYSROOT: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("tools/cpp/unix_cc_configure.bzl")
          text = path.read_text()
          marker = "    builtin_include_directories = _uniq(\n"
          additions = (
              "        [\n"
              f"            {os.environ['NDK_SYSROOT']!r} + '/usr/include',\n"
              f"            {os.environ['NDK_SYSROOT']!r} + '/usr/include/aarch64-linux-android',\n"
              "        ] +\n"
          )
          assert text.count(marker) == 1
          path.write_text(text.replace(marker, marker + additions))
          PY
          sed -n '444,462p' tools/cpp/unix_cc_configure.bzl

      - name: Patch Bazel JNI source for Android bionic strerror_r
        working-directory: src
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/native/unix_jni_linux.cc")
          text = path.read_text()
          old = "#if !__GLIBC__ || (_POSIX_C_SOURCE >= 200112L && !_GNU_SOURCE)"
          new = "#if (!__GLIBC__ && !defined(__BIONIC__)) || (_POSIX_C_SOURCE >= 200112L && !_GNU_SOURCE)"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          grep -n -A9 -B3 '__BIONIC__' src/main/native/unix_jni_linux.cc

      - name: Patch Bazel 6.3 bootstrap for JDK 17 module access
        working-directory: src
        run: |
          sed -i '/-Djava.util.logging.config.file=/a\      --add-opens java.base/java.lang=ALL-UNNAMED \\' scripts/bootstrap/compile.sh
          grep -n -A3 -B2 'java.base/java.lang' scripts/bootstrap/compile.sh

      - name: Bootstrap Android aarch64 Bazel
        working-directory: src
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          BAZEL_WRKDIR: ${{ github.workspace }}/work
          CC: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          CXX: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++
          AR: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          STRIP: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          BAZEL_CXXOPTS: -std=c++17
          EXTRA_BAZEL_ARGS: >-
            --host_javabase=@local_jdk//:jdk
            --host_copt=-Wno-error=deprecated-builtins
            --copt=--target=aarch64-linux-android${{ env.ANDROID_API }}
            --copt=--sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --copt=-fPIC
            --copt=-Wno-error=deprecated-builtins
            --linkopt=--target=aarch64-linux-android${{ env.ANDROID_API }}
            --linkopt=--sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --linkopt=-pie
            --linkopt=-llog
            --features=-parse_headers
        run: |
          set -o pipefail
          ./compile.sh 2>&1 | tee ../bootstrap.log

      - name: Verify Android ELF and minimize artifact
        run: |
          set -eux
          BIN=src/output/bazel
          test -x "$BIN"
          file "$BIN"
          readelf -h "$BIN" | tee elf-header.txt
          readelf -l "$BIN" | tee elf-program-headers.txt
          readelf -d "$BIN" | tee elf-dynamic.txt
          readelf -h "$BIN" | grep -q 'AArch64'
          readelf -l "$BIN" | grep -q '/system/bin/linker64'
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$BIN"
          mkdir artifact
          cp "$BIN" artifact/bazel
          cp elf-header.txt elf-program-headers.txt elf-dynamic.txt artifact/
          sha256sum artifact/bazel | tee artifact/bazel.sha256

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-${{ env.BAZEL_VERSION }}-termux-aarch64
          path: |
            artifact/
            bootstrap.log
          if-no-files-found: warn
